[build-system]
requires = ["hatchling>=1.18,<1.19"]
build-backend = "hatchling.build"

[project]
name = "quoin"
dynamic = ["version"]
description = "Workflow state for stateless coding agents — structured persistence for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [
    { name = "IvGor" },
]
classifiers = [
    "License :: Other/Proprietary License",
]

[project.urls]
Homepage = "https://github.com/FourthWiz/quoin"
Source = "https://github.com/FourthWiz/quoin"
Issues = "https://github.com/FourthWiz/quoin/issues"

[project.scripts]
quoin = "quoin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "build",
    "pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/quoin/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quoin"]

[tool.hatch.build.targets.wheel.force-include]
"quoin/skills" = "src/quoin/data/skills"
"quoin/scripts" = "src/quoin/data/scripts"
"quoin/hooks" = "src/quoin/data/hooks"
"quoin/core" = "src/quoin/data/core"
"quoin/adapters/claude" = "src/quoin/data/adapters/claude"
"quoin/adapters/codex" = "src/quoin/data/adapters/codex"
"quoin/adapters/opencode" = "src/quoin/data/adapters/opencode"
"quoin/QUICKSTART.md" = "src/quoin/data/QUICKSTART.md"
"quoin/CLAUDE.md" = "src/quoin/data/CLAUDE.md"
"quoin/CLAUDE.slim.md" = "src/quoin/data/CLAUDE.slim.md"
"quoin/memory" = "src/quoin/data/memory"
"quoin/tools/agentdesk" = "src/quoin/data/tools/agentdesk"

[tool.hatch.build.targets.sdist]
include = [
    "quoin/",
    "pyproject.toml",
    "LICENSE",
    "README.md",
    "quoin/install.sh",
]
exclude = [
    "benchmark-results/",
    "quoin/dev/",
    "quoin/benchmarks/",
    "quoin/scripts/tests/",
    "quoin/.workflow_artifacts/",
    "quoin/.pytest_cache/",
    "quoin/**/__pycache__/",
    "quoin/**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["quoin/dev/tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-q"
pythonpath = ["src", "."]
timeout = 240
timeout_method = "thread"
markers = [
    "smoke: fast smoke subset (pre-existing usage in test_quoin_stage1_recursion_abort.py and others; registered to resolve unregistered-marker warnings)",
    "slow_fs: touches the working tree / Drive mount; allow a longer timeout",
]

[tool.pyright]
pythonVersion = "3.10"
extraPaths = ["src", "quoin/dev/tests"]
