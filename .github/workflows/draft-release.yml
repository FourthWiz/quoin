name: Draft release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    name: Create or refresh draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          version=$(python3 -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("src/quoin/__about__.py").read())[1])')
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create or refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$state" = "false" ]; then
            echo "$TAG is already published; version was not bumped, nothing to draft."
            exit 0
          fi
          # Drafts carry no tag yet, so recreating is the simplest way to regenerate notes.
          if [ "$state" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --generate-notes --target "$GITHUB_SHA" --title "$TAG"
