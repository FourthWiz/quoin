name: Adapter Completeness Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  adapter-check:
    name: Validate adapter drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run adapter completeness check
        run: python3 quoin/core/scripts/validate_adapter_drift.py

      - name: Run registration roster check
        run: python3 quoin/dev/check_registration.py

      - name: Run OpenCode manifest drift check
        run: PYTHONPATH=src python3 -m quoin.opencode_adapter check-manifest --source-dir quoin

      - name: Run OpenCode doctor smoke check
        run: PYTHONPATH=src python3 -m quoin doctor --runtime opencode --smoke --project-root .
