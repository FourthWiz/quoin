name: Adapter Completeness Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  adapter-check:
    name: Validate adapter drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run adapter completeness check
        run: python3 quoin/core/scripts/validate_adapter_drift.py

      - name: Run registration roster check
        run: python3 quoin/dev/check_registration.py

      - name: Check generated slim rules are fresh
        run: python3 quoin/scripts/build_claude_slim.py --check

      - name: Install test runner
        run: python3 -m pip install pytest

      - name: Run benchmark acceptance tests
        run: python3 -m pytest -q quoin/dev/tests/test_benchmarks.py
